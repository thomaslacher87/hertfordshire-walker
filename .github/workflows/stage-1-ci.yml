name: Stage 1 foundation

on:
  pull_request:
    branches: [main]
  push:
    branches: [stage-1-foundation]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify foundation
        run: npm run check

      - name: Upload Pages-ready preview
        uses: actions/upload-artifact@v4
        with:
          name: stage-1-pages-preview
          path: dist
          if-no-files-found: error
